{% load tailwind_tags %}
{% load static %}
{% load widget_tweaks %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
              content="A brief and concise description of your webpage content goes here.">
        <title>
            {% block title %}
            {% endblock title %}
        </title>
        {% tailwind_css %}
        {% component_css_dependencies %}
        <script src="{% static 'js/htmx/htmx.min.js' %}"></script>
        <script src="{% static 'js/htmx/ws.min.js' %}"></script>
    </head>
    <body hx-headers="{'X-CSRFToken': '{{ csrf_token }}'}"
          class="dark:bg-gray-900">
        {% block content %}
        {% endblock content %}
        <script>
      document.body.addEventListener('htmx:afterSwap', (event) => {
        // Reinitialize Flowbite after swapping an element
        window.initFlowbite();
      });
      document.body.addEventListener('htmx:historyRestore', function(evt) {
            // Reinitialize Flowbite when using back/forward navigation
            window.initFlowbite();
      });
      document.body.addEventListener('htmx:wsBeforeMessage', function(event) {
            // Reinitialize Flowbite when using back/forward navigation
        try {
        // Try to parse the string into a JSON object
          const parsedJson = JSON.parse(event.detail.message);

        // Check if the key exists in the parsed JSON object
            if ("Hx-New-URL" in parsedJson) {
                // htmx.trigger()
                const url = new URL(parsedJson["Hx-New-URL"])
                console.log(url)
                history.pushState({}, "", url) ;
            } else {
                return false;  // JSON is valid, but does not contain the key
            }
        } catch (error) {
            // If an error occurs, it's not a valid JSON
            return false;
        }

      });
        </script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.js"></script>
        {% component_js_dependencies %}
    </body>
</html>
