    <li id="conversation-{{ slug }}">
        <a hx-get="{% url 'chats:conversation' slug %}"
           hx-trigger="click"
           hx-target="#page-content"
           hx-swap="innerHTML scroll:#message-list:bottom"
           hx-push-url="true"
           hx-history="false"
           id="{{ slug }}"
           class="cursor-pointer flex items-center w-full p-2 text-gray-900 transition duration-75 rounded-lg pl-11 group hover:bg-gray-100 dark:text-white dark:hover:bg-gray-700 {% if current_section == slug %}bg-gray-100 dark:bg-gray-700{% endif %}"
           onclick="highlightButton(this)"
           data-popover-target="popover-{{ slug }}"
           data-popover-placement="right">
            <span class="flex-1 text-left rtl:text-right whitespace-nowrap truncate">{{ title|render_markdown }}</span>
            <svg data-dropdown-toggle="dropdownDots-{{ slug }}"
                 data-dropdown-trigger="hover"
                 data-dropdown-placement="right-end"
                 class="w-4 h-4"
                 aria-hidden="true"
                 xmlns="http://www.w3.org/2000/svg"
                 fill="currentColor"
                 viewBox="0 0 4 15">
                <path d="M3.5 1.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Zm0 6.041a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Zm0 5.959a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" />
            </svg>
        </a>
        <div data-popover
             id="popover-{{ slug }}"
             role="tooltip"
             class="absolute z-10 invisible inline-block w-64 text-sm text-gray-500 transition-opacity duration-300 bg-white border border-gray-200 rounded-lg shadow-xs opacity-0 dark:text-gray-400 dark:border-gray-600 dark:bg-gray-800">
            <div class="px-3 py-2 bg-gray-100 border-b border-gray-200 rounded-t-lg dark:border-gray-600 dark:bg-gray-700">
                <h3 class="font-semibold text-gray-900 dark:text-white">{{ created_date }}</h3>
            </div>
            <div class="px-3 py-2">
                <p>{{ title|render_markdown }}</p>
            </div>
            <div data-popper-arrow></div>
        </div>
        <div id="dropdownDots-{{ slug }}"
             class="z-10 hidden bg-white divide-y divide-gray-100 rounded-lg shadow-sm w-44 dark:bg-gray-700 dark:divide-gray-600 border dark:border-gray-600"
             data-popper-reference-hidden=""
             data-popper-escaped=""
             data-popper-placement="right-end">
            <ul class="py-2 text-sm text-gray-700 dark:text-gray-200"
                aria-labelledby="dropdownMenuIconButton">
                <li>
                    <a class="cursor-pointer block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white"
                       data-modal-target="confirmation-modal-delete-conversation"
                       data-modal-toggle="confirmation-modal-delete-conversation"
                       hx-trigger="confirmed"
                       hx-target="#conversation-{{ slug }}"
                       hx-swap="outerHTML swap:1s"
                       hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                       hx-delete="{% url 'chats:conversation-delete' slug %}"
                       onclick="confirmAction(this)">
                        <svg class="w-5 h-5 text-gray-800 dark:text-white"
                             aria-hidden="true"
                             xmlns="http://www.w3.org/2000/svg"
                             width="24"
                             height="24"
                             fill="none"
                             viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 7h14m-9 3v8m4-8v8M10 3h4a1 1 0 0 1 1 1v3H9V4a1 1 0 0 1 1-1ZM6 7h12v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7Z" />
                        </svg>
                        <span class="ms-3">{% trans "Delete" %}</span>
                    </a>
                </li>
            </ul>
        </div>
    </li>
</ul>
