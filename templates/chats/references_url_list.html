<div id="{{ id }}" hx-swap-oob="beforeend">
    <ul class="max-w-md space-y-1 text-gray-500 list-disc list-inside dark:text-gray-400">
        {% for url in urls %}
            <li>
                <a href="{{ url }}"
                   class="text-blue-700 dark:text-blue-500 underline hover:no-underline font-medium break-all">{{ url }}</a>
            </li>
        {% endfor %}
    </ul>
</div>
