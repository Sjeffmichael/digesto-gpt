    <div class="flex flex-col max-w-md w-full leading-1.5 p-4 border-gray-200 bg-gray-100 rounded-e-xl rounded-es-xl dark:bg-gray-700">
        <div id="msg_id_{{ message.id }}"
             class="break-words font-normal text-sm py-2.5 text-gray-900 dark:text-white">
            {% if message.bot_message is None %}
                <div class="mx-auto w-full max-w-sm rounded-md">
                    <div class="flex animate-pulse space-x-4">
                        <div class="flex-1 space-y-6 py-1">
                            <div class="space-y-3">
                                <div class="h-2 rounded bg-gray-200"></div>
                                <div class="grid grid-cols-3 gap-4">
                                    <div class="col-span-1 h-2 rounded bg-gray-200"></div>
                                    <div class="col-span-2 h-2 rounded bg-gray-200"></div>
                                </div>
                                <div class="h-2 rounded bg-gray-200"></div>
                                <div class="grid grid-cols-3 gap-4">
                                    <div class="col-span-2 h-2 rounded bg-gray-200"></div>
                                    <div class="col-span-1 h-2 rounded bg-gray-200"></div>
                                </div>
                                <div class="h-2 rounded bg-gray-200"></div>
                            </div>
                        </div>
                    </div>
                </div>
            {% endif %}
            {{ message.bot_message|render_markdown }}
        </div>
