[tool.poetry]
name = "on-premise-gpt"
version = "0.1.0"
description = ""
authors = ["Sjeffmichael <sjeffmichael56@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
django = "^4.2.5"
django-tailwind = "^3.6.0"
django-browser-reload = "^1.11.0"
django-htmx = "^1.16.0"
django-compressor = "^4.4"
django-widget-tweaks = "^1.5.0"
celery = "^5.4.0"
redis = "^5.0.7"
selenium = "^4.23.0"
django-components = "^0.86"
pre-commit = "^3.8.0"
python-dotenv = "^1.0.1"
channels = "^4.1.0"
daphne = "^4.1.2"
markdown = "^3.7"
ragas = "^0.1.20"
langchain-google-genai = "1.0.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "django"

[tool.djlint]
profile = "django"
ignore = "H031,H006,H025"
