{% load i18n %}
<div id="user-data-modal"
     tabindex="-1"
     aria-hidden="true"
     class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full h-screen">
    <div class="relative p-4 w-full max-w-lg md:max-w-2xl lg:max-w-3xl max-h-full">
        <!-- Modal content -->
        <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
            <!-- Modal header -->
            <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
                <h3 class="text-lg font-semibold text-gray-900 dark:text-white">{{ modal_header }}</h3>
                <button id="user-data-modal-close"
                        type="button"
                        class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
                    <svg class="w-3 h-3"
                         aria-hidden="true"
                         xmlns="http://www.w3.org/2000/svg"
                         fill="none"
                         viewBox="0 0 14 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
                    </svg>
                    <span class="sr-only">Close modal</span>
                </button>
            </div>
            <!-- Modal body -->
            <form id="user-data-form"
                  class="p-4 md:p-5"
                  hx-post="{% url 'upsert-user' %}"
                  hx-target="#table-content"
                  hx-vals="js:function(){return{ 
                    limit: document.getElementById('pag-limit').value, 
                    page: document.getElementsByClassName('current-page')[0].text }}"
                  hx-encoding='multipart/form-data'>
                {% csrf_token %}
                <div class="grid gap-4 mb-4 grid-cols-2">
                    <div class="col-span-2">
                        <label for="user-title"
                               class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">User Name
                        </label>
                        <input type="text"
                               name="username"
                               id="user-name"
                               class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                               placeholder="{% trans "User Title" %}"
                               required=""
                               {% if user_data %}value="{{ user_data.username }}"{% endif %}>
                    </div>
                    <div class="col-span-2">
                        <label for="user-title"
                               class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">First name
                        </label>
                        <input type="text"
                               name="first_name"
                               id="user-first-name"
                               class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                               placeholder="{% trans "User name" %}"
                               required=""
                               {% if user_data %}value="{{ user_data.first_name }}"{% endif %}>
                    </div>
                    <div class="col-span-2">
                        <label for="user-title"
                               class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Last name</label>
                        <input type="text"
                               name="last_name"
                               id="user-last-name"
                               class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                               placeholder="Last name"
                               required=""
                               {% if user_data %}value="{{ user_data.last_name }}"{% endif %}>
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                        <label for="user-number"
                               class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Email</label>
                        <input type="text"
                               name="email"
                               id="user-email"
                               class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                               placeholder="Email"
                               required=""
                               {% if user_data %}value="{{ user_data.email }}"{% endif %}>
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                        <label for="admin"
                               class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Administrator</label>
                        <select id="admin"
                                name="is_admin"
                                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
                            {% for admin in administrator %}
                                <option value="{{ admin }}"
                                        {% if not user_data and forloop.first %} selected {% elif user_data %} {% if admin == user_data.is_admin %}selected{% endif %}
                                        {% endif %}>{{ admin }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label for="user-title"
                               class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Password</label>
                        <input type="text"
                               name="password"
                               id="password"
                               class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                               placeholder="Password"
                               required=""
                               {% if user_data %}value="{{ user_data.password }}"{% endif %}>
                    </div>
                    <div class="col-span-2">
                        <label for="user-title"
                               class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Confirm password</label>
                        <input type="text"
                               name="confirmpassword"
                               id="confirmpassword"
                               class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                               placeholder="Confirm password"
                               required=""
                               {% if user_data %}value="{{ user_data.confirmpassword }}"{% endif %}>
                    </div>
                </div>
                <button id="user-data-modal-submit"
                        type="submit"
                        class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                    <svg class="me-1 -ms-1 w-5 h-5"
                         fill="currentColor"
                         viewBox="0 0 20 20"
                         xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd">
                        </path>
                    </svg>
                    {{ confirm_botton_text }}
                </button>
            </form>
        </div>
    </div>
</div>
