<div class="flex items-center justify-center w-full">
    <label id="dropzone-file-input"
           for="dropzone-file"
           class="flex flex-col items-center justify-center w-full h-64 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 dark:bg-gray-700 hover:bg-gray-100 dark:border-gray-600 dark:hover:bg-gray-800 dark:hover:border-gray-500 transition-colors ease-in-out duration-300">
        <div class="flex flex-col items-center justify-center pt-5 pb-6">
            <svg class="w-10 h-10 mb-4 text-blue-500 dark:text-blue-400"
                 aria-hidden="true"
                 xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 20 16">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2" />
            </svg>
            <p class="mb-2 text-sm text-gray-500 dark:text-gray-400">
                <span class="font-semibold">Click to upload</span> or drag and drop
            </p>
            <p class="text-xs text-gray-500 dark:text-gray-400">HTML or PDF</p>
        </div>
        <input id="dropzone-file"
               type="file"
               class="hidden"
               name="file"
               accept="application/pdf, text/html" />
    </label>
</div>
<div id="file-info"
     class="hidden mt-4 flex items-center justify-between w-full p-3 bg-gray-100 dark:bg-gray-800 rounded-lg shadow-md">
    <span id="file-name"
          class="text-sm text-gray-700 dark:text-gray-300 flex-grow max-w-full truncate"></span>
    <button id="remove-file"
            class="ml-2 text-red-500 hover:text-red-700 focus:outline-none">
        <svg class="w-6 h-6"
             aria-hidden="true"
             xmlns="http://www.w3.org/2000/svg"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
        <span class="sr-only">Remove file</span>
    </button>
</div>
